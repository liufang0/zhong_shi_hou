<VirtualHost *:80>
    DocumentRoot /app/public

    <Directory /app/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # 前端 SPA
    Alias /web/ /app/web/
    <Directory /app/web>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /web/index.html
    </Directory>

    # 前端静态资源（web/index.html 用绝对路径 /static/ 引用）
    Alias /web/static/ /app/web/static/
    <Directory /app/web/static>
        Options FollowSymLinks
        Require all granted
    </Directory>

    # 禁止访问 runtime
    <Directory /app/runtime>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
